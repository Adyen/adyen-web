npmMinimalAgeGate: "21d"
npmPreapprovedPackages:
  - "vite@6.4.3"
  - "@adyen/*"
  - "storybook@10.6.2"
  - "@storybook/addon-a11y@10.6.2"
  - "@storybook/addon-docs@10.6.2"
  - "@storybook/preact-vite@10.6.2"
  - "eslint-plugin-storybook@10.6.2"
  - "shell-quote@1.11.0"
  