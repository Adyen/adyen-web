# Flags a broken release during a hotfix:
#   - adds a "do not use" notice to the affected GitHub release (and renames it)
#   - while the fix is pending, optionally marks the last good release as "Latest" on GitHub
#   - once the fix is out, points the notice at the patch and adds a hotfix note to the patch release
#   - notifies the Docs team (#web-release-notes) and the team channel on Slack
#
# Run it twice per hotfix:
#   1. right after the bug is confirmed (leave `fixed-version` empty)
#   2. after the patch is published to npm (set `fixed-version`)
# Re-running replaces the existing notice; it never stacks a second one.
#
# Everything in `summary` and `public-issue-url` is published on a PUBLIC GitHub release.

name: Flag Affected Release

on:
  workflow_dispatch:
    inputs:
      affected-version:
        description: 'Broken version, without "v" (e.g. 6.47.0)'
        required: true
        type: string
      summary:
        description: 'PUBLIC, customer-facing impact in one or two sentences (e.g. "Card payments fail in Safari 17 when ...")'
        required: true
        type: string
      fixed-version:
        description: 'Patch version, without "v" (e.g. 6.47.1). Leave empty while the fix is pending.'
        required: false
        type: string
      previous-version:
        description: 'Last good version to recommend while the fix is pending (e.g. 6.46.0). Also marked as "Latest" on GitHub.'
        required: false
        type: string
      public-issue-url:
        description: 'Optional PUBLIC GitHub issue with details'
        required: false
        type: string
      notify-docs:
        description: 'Notify the Docs team in #web-release-notes'
        required: true
        type: boolean
        default: true

concurrency:
  group: flag-affected-release-${{ inputs.affected-version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flag-release:
    if: github.repository == 'adyen/adyen-web'
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit GitHub releases
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      AFFECTED_VERSION: ${{ inputs.affected-version }}
      FIXED_VERSION: ${{ inputs.fixed-version }}
      PREVIOUS_VERSION: ${{ inputs.previous-version }}
      SUMMARY: ${{ inputs.summary }}
      PUBLIC_ISSUE_URL: ${{ inputs.public-issue-url }}
    steps:
      - name: Checkout templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: Validate inputs
        run: |
          set -euo pipefail
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          for NAME in AFFECTED_VERSION FIXED_VERSION PREVIOUS_VERSION; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ] && [[ ! "$VALUE" =~ $SEMVER ]]; then
              echo "::error::$NAME '$VALUE' is not a version like 6.47.0 (no leading 'v')."
              exit 1
            fi
          done

          if [ -n "$PUBLIC_ISSUE_URL" ] && [[ ! "$PUBLIC_ISSUE_URL" =~ ^https://github\.com/ ]]; then
            echo "::error::public-issue-url must be a public GitHub link. Internal links must not go on a public release."
            exit 1
          fi

          if [[ "$SUMMARY" =~ (adyen\.com|slack\.com) ]]; then
            echo "::error::The summary looks like it contains an internal link. It is published on a public release."
            exit 1
          fi

          gh release view "v$AFFECTED_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null \
            || { echo "::error::No GitHub release v$AFFECTED_VERSION."; exit 1; }

          if [ -n "$FIXED_VERSION" ]; then
            gh release view "v$FIXED_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null \
              || { echo "::error::No GitHub release v$FIXED_VERSION. Run the Hotfix Release workflow first."; exit 1; }
          fi

          if [ -n "$PREVIOUS_VERSION" ]; then
            gh release view "v$PREVIOUS_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null \
              || { echo "::error::No GitHub release v$PREVIOUS_VERSION."; exit 1; }
          fi

      - name: Add notice to the affected release
        run: |
          set -euo pipefail
          if [ -n "$FIXED_VERSION" ]; then
            TEMPLATE=.github/hotfix-templates/affected-release-fixed.md
          else
            TEMPLATE=.github/hotfix-templates/affected-release-fix-pending.md
          fi

          gh release view "v$AFFECTED_VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/affected-body.md

          node .github/scripts/hotfix-notice.js \
            --template "$TEMPLATE" \
            --marker hotfix-warning \
            --body-in /tmp/affected-body.md \
            --body-out /tmp/affected-body.new.md

          gh release edit "v$AFFECTED_VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "$AFFECTED_VERSION [DO NOT USE]" \
            --notes-file /tmp/affected-body.new.md

          {
            echo "### Notice added to v$AFFECTED_VERSION"
            echo
            cat /tmp/affected-body.new.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the last good release as Latest on GitHub
        if: inputs.fixed-version == '' && inputs.previous-version != ''
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$LATEST" = "v$AFFECTED_VERSION" ]; then
            gh release edit "v$PREVIOUS_VERSION" --repo "$GITHUB_REPOSITORY" --latest
            echo "Marked v$PREVIOUS_VERSION as Latest on GitHub." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Latest GitHub release is $LATEST, not v$AFFECTED_VERSION. Leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add hotfix note to the patch release
        if: inputs.fixed-version != ''
        run: |
          set -euo pipefail
          gh release view "v$FIXED_VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/fixed-body.md

          node .github/scripts/hotfix-notice.js \
            --template .github/hotfix-templates/hotfix-release-note.md \
            --marker hotfix-note \
            --body-in /tmp/fixed-body.md \
            --body-out /tmp/fixed-body.new.md

          gh release edit "v$FIXED_VERSION" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/fixed-body.new.md

  notify:
    needs: flag-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag
    steps:
      - name: Build messages
        id: messages
        env:
          AFFECTED_VERSION: ${{ inputs.affected-version }}
          FIXED_VERSION: ${{ inputs.fixed-version }}
          PREVIOUS_VERSION: ${{ inputs.previous-version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          AFFECTED_LINK="<$RELEASES_URL/v$AFFECTED_VERSION|v$AFFECTED_VERSION>"

          if [ -n "$FIXED_VERSION" ]; then
            FIXED_LINK="<$RELEASES_URL/v$FIXED_VERSION|v$FIXED_VERSION>"
            DOCS="Hotfix released for adyen-web $AFFECTED_LINK."
            DOCS+=$'\n'"• *Issue:* $SUMMARY"
            DOCS+=$'\n'"• *Fixed in:* $FIXED_LINK"
            DOCS+=$'\n'"• *Action:* please update the warning on the v$AFFECTED_VERSION release notes to say it is fixed in v$FIXED_VERSION, and publish the v$FIXED_VERSION release notes."
            TEAM="v$AFFECTED_VERSION notice now points to $FIXED_LINK."
          else
            DOCS=":warning: Critical issue in adyen-web $AFFECTED_LINK. Users should not use this version."
            DOCS+=$'\n'"• *Issue:* $SUMMARY"
            if [ -n "$PREVIOUS_VERSION" ]; then
              DOCS+=$'\n'"• *Recommended version until the fix ships:* v$PREVIOUS_VERSION"
            fi
            DOCS+=$'\n'"• *Action:* please add a \"do not use\" warning to the v$AFFECTED_VERSION release notes. We will post again with the fixed version."
            TEAM="Flagged $AFFECTED_LINK as broken on GitHub. Fix pending."
          fi

          {
            echo "docs<<EOF"; echo "$DOCS"; echo "EOF"
            echo "team<<EOF"; echo "$TEAM"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Docs team
        if: inputs.notify-docs
        uses: Adyen/github-actions/slack-app-send-message@66cba28775090b2aa2c6d5bfbbde24264b549d15
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.WEB_RELEASE_NOTES_CHANNEL_ID }}
          message: ${{ steps.messages.outputs.docs }}

      - name: Notify team channel
        uses: Adyen/github-actions/slack-app-send-message@66cba28775090b2aa2c6d5bfbbde24264b549d15
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.CHECKOUT_WEB_CHANNEL_ID }}
          message: ${{ steps.messages.outputs.team }}
